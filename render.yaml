# Render blueprint — persistent Node Web Service (NOT serverless).
# A long-lived process is required: node-cron must keep ticking for 48 hours
# after an agent is initialized, which a serverless/edge deployment cannot do.
services:
  - type: web
    name: autonomous-persona-agent
    runtime: node
    plan: free
    region: oregon

    # Installs backend deps, then installs + builds the React/Vite frontend into
    # client/dist, which the Express server serves as static assets.
    buildCommand: npm install && npm run build

    # Single process: Express serves the API, the built frontend, and the cron loop.
    startCommand: npm start

    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      # sync:false = Render prompts for these in the dashboard and never stores them in git.
      # GROQ is the default text provider: its free tier is measured per minute at high
      # volume rather than ~20 requests per model per day, which is what previously forced
      # cadence stretching just to publish a few posts. Get one at console.groq.com/keys.
      - key: GROQ_API_KEY
        sync: false
      # Optional. Only needed if you set TEXT_PROVIDER=gemini, which also enables grounded
      # (Google Search) discovery; otherwise discovery runs from RSS/HN feeds.
      - key: GEMINI_API_KEY
        sync: false
      # better-sqlite3 is a native module; pinning Node avoids an ABI mismatch between
      # Render's default runtime and the version the project was built against.
      - key: NODE_VERSION
        value: 22.19.0

# TWO FREE-TIER CAVEATS, both of which affect the 48-hour autonomy window:
#
# 1. Render sleeps a free web service after ~15 minutes without inbound traffic, which
#    stops the cron timer. Two mitigations are built in: a self-ping to /api/health every
#    12 minutes whenever RENDER_EXTERNAL_URL is set, and overdue-detection in the
#    scheduler, so a revived instance immediately runs the cycle it owed instead of
#    losing it. Robust, but not bulletproof.
#
# 2. The free filesystem is ephemeral, so data/store.db is reset on every deploy or
#    instance restart. The schema is recreated automatically on boot, so the app always
#    comes back clean rather than crashing — but post history does not survive.
#
# To fix both, move to a paid instance and attach a disk:
#
#   plan: starter
#   disk:
#     name: agent-data
#     mountPath: /var/data
#     sizeGB: 1
#   envVars:
#     - key: DATA_DIR
#       value: /var/data

# Post artwork needs no key at all — Pollinations.ai image generation is free and
# unauthenticated. Set POST_IMAGES=false to publish text-only.
